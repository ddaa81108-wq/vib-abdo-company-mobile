# Negative permission tests. CI runs `flutter test --tags permissions-negative`
# and fails the build if none ran. Declare the tag here and in the app
# dart_test.yaml. See docs/TESTING.md.
# Included in the default run. Select with --tags permissions-negative.
tags:
  permissions-negative:
  # Behaviour that is tested as it works today and can be flipped when the
  # owner decides. Included in the default run.
  pending-decision:
  # Current production or fake behaviour that is asserted, not treated as a pass.
  known-bug:
  # Site contract samples. Included in the default run. Select with --tags contract.
  contract:
