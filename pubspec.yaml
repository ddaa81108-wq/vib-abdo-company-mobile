name: vib_abdo_company_mobile
description: Android client for debt, trust, and collection records.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_api_layer:
    path: packages/api_layer
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  # Newest release that still builds here. 13.0.0+ depends on
  # permission_handler_android 14.x, which sets compileSdk 37. This app
  # stays on compileSdk 36, so the pin is 12.0.3 (android plugin 13.0.1,
  # compileSdk 35, minSdk 19).
  permission_handler: 12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
