# The screenshot tag paints via RenderRepaintBoundary.toImage. Headless CI
# excludes it. Refresh images with:
#   flutter test --dart-define=CAPTURE_SCREENSHOTS=true --name screenshots
#
# permissions-negative is the Phase 5 gate. CI runs only these tests and fails
# if none ran. The same tag is declared in packages/api_layer/dart_test.yaml.
# See docs/TESTING.md.
tags:
  screenshots:
  # Included in the default run. Select with --tags permissions-negative.
  permissions-negative:
  # Behaviour that is tested as it works today and can be flipped when the
  # owner decides. Included in the default run.
  pending-decision:
  # Current production or fake behaviour that is asserted, not treated as a pass.
  known-bug:
  # Phase 8. Included in the default run. Select with --tags reconciliation.
  reconciliation:
