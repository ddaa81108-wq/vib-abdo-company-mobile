# Pull-request and main checks. Debug build only; no signing secrets.
# Required-check names for branch protection are the job names below.
# See docs/BRANCH_PROTECTION.md.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze app
        run: flutter analyze
      - name: Analyze API package
        working-directory: packages/api_layer
        run: flutter analyze

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Release preflight checks
        run: bash tool/android_release_preflight_test.sh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Test app
        run: flutter test
      - name: Test API package
        working-directory: packages/api_layer
        run: flutter test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
