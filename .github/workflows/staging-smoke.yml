# P-01 staging smoke. Manual only.
#
# workflow_dispatch is not available until this file is on the default branch.
# There is no push, pull_request, or schedule trigger. Do not add a temporary
# push trigger.
#
# The job is pinned to the GitHub Environment named staging. It only probes
# unauthenticated GET /api/health. It does not log in and it does not read
# account credentials. Do not store staging usernames or passwords in GitHub.
#
# STAGING_API_BASE is a secret on that environment. Its intended value is
# https://staging.vip2100.com with no /erp suffix (the UI is under /erp, the
# API is /api on the origin). An empty value or an /erp suffix fails the job.
# A same-named variable is accepted only as a fallback and is not recommended.
# The value is masked and never printed.
#
# curl sends User-Agent VibAbdoMobileSmoke/1.0 (+github-actions). Python in
# tool/staging_smoke does not open a socket. Cloudflare rejects Python-urllib.
#
# actions/checkout is pinned to a commit SHA because this job can see the
# staging secret. The tag is only a comment.
#
# This workflow is not one of the required pull-request checks and does not
# change them.

name: Staging smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-smoke:
    name: Staging smoke
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Offline smoke self-check
        run: bash tool/staging_smoke/reachability_test.sh

      - name: Mask staging origin
        env:
          STAGING_API_BASE: ${{ secrets.STAGING_API_BASE || vars.STAGING_API_BASE }}
        run: bash tool/staging_smoke/reachability.sh --mask

      - name: Unauthenticated reachability
        env:
          STAGING_API_BASE: ${{ secrets.STAGING_API_BASE || vars.STAGING_API_BASE }}
        run: bash tool/staging_smoke/reachability.sh
