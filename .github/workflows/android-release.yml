# Builds a signed release AAB and APK. Signing material comes from
# repository secrets only. See docs/RELEASE.md.
name: Android release

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "versionName override (MAJOR.MINOR.PATCH). Defaults to pubspec.yaml."
        required: false
        type: string
      build_number:
        description: "versionCode override (integer >= 1). Defaults to the +number in pubspec.yaml. Must be higher than any versionCode already uploaded to Play."
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: write

jobs:
  signed-release:
    name: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tool/android_release_preflight.sh secrets

      - name: Resolve release version
        id: version
        if: steps.secrets.outputs.mode == 'build'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_TAG: ${{ github.ref_name }}
          INPUT_BUILD_NAME: ${{ inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: bash tool/android_release_preflight.sh version

      - name: Warn when the application id is still a placeholder
        if: steps.secrets.outputs.mode == 'build'
        run: |
          set -euo pipefail
          if grep -q 'com.example.vib_abdo_company_mobile' android/app/build.gradle.kts; then
            echo "::warning title=Placeholder application id::applicationId is still com.example.vib_abdo_company_mobile. These artifacts exercise the signing path only. Keep them off Play until the id is replaced. See docs/RELEASE.md."
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              echo "- applicationId: \`com.example.vib_abdo_company_mobile\` (placeholder; keep off Play)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Set up Java
        if: steps.secrets.outputs.mode == 'build'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        if: steps.secrets.outputs.mode == 'build'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Decode upload keystore
        if: steps.secrets.outputs.mode == 'build'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          dest="${RUNNER_TEMP}/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$dest"
          if [[ ! -s "$dest" ]]; then
            echo "::error::Decoded keystore is empty." >&2
            exit 1
          fi
          chmod 600 "$dest"

      - name: Build signed release AAB and APK
        if: steps.secrets.outputs.mode == 'build'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -euo pipefail
          flutter pub get
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Reject a debug-signed artifact
        if: steps.secrets.outputs.mode == 'build'
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          aab="build/app/outputs/bundle/release/app-release.aab"
          [[ -f "$apk" && -f "$aab" ]]
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk" ]]; then
            echo "::error::ANDROID_HOME is not set, so apksigner cannot be found." >&2
            exit 1
          fi
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "::error::apksigner was not found under $sdk/build-tools." >&2
            exit 1
          fi
          "$apksigner" verify "$apk"
          certs="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certs"
          if printf '%s\n' "$certs" | grep -q "Android Debug"; then
            echo "::error::APK is signed with the Android debug certificate." >&2
            exit 1
          fi
          if ! aab_certs="$(jarsigner -verify -verbose -certs "$aab" 2>&1)"; then
            printf '%s\n' "$aab_certs" | grep -E "CN=|Android Debug|jar verified|unsigned" || true
            echo "::error::AAB signature verification failed." >&2
            exit 1
          fi
          printf '%s\n' "$aab_certs" | awk '/X\.509,|jar verified/ && n < 8 { print; n++ }'
          if printf '%s\n' "$aab_certs" | grep -q "Android Debug"; then
            echo "::error::AAB is signed with the Android debug certificate." >&2
            exit 1
          fi
          if ! printf '%s\n' "$aab_certs" | grep -q "CN="; then
            echo "::error::AAB certificate subject was not printed, so the signer could not be checked." >&2
            exit 1
          fi

      - name: Upload signed AAB and APK
        if: steps.secrets.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Delete decoded keystore
        if: always() && steps.secrets.outputs.mode == 'build'
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks"
