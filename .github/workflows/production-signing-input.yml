name: Production APK for local signing

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Version code higher than the installed release
        required: true
        default: '22'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
          pub-cache: true
      - uses: ./.github/actions/install-android-ndk
      - name: Build production signing input without the original signing key
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          (( BUILD_NUMBER > 21 && BUILD_NUMBER <= 2100000000 ))
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          flutter pub get --enforce-lockfile
          tool/decode_google_services_json.sh
          export ENABLE_GOOGLE_SERVICES=true
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          s = p.read_text()
          old = 'org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError'))
          PY
          # Gradle uses its disposable debug key here. This artifact is NOT a
          # distributable update. The original key stays on the owner's PC;
          # the downloaded APK must be re-signed and verified there.
          flutter build apk --release --build-name=1.0.0 --build-number="$BUILD_NUMBER" \
            --dart-define=USE_FAKE_API=false \
            --dart-define=API_BASE=https://vip2100.com \
            --dart-define=EMPLOYEE_TOTALS_SOURCE=collections \
            --dart-define=COLLECTIONS_WHITE_GOLD=true
          python3 tool/scan_release_apk.py build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/signing-input
          cp build/app/outputs/flutter-apk/app-release.apk build/signing-input/DO-NOT-INSTALL-signing-input.apk
          git rev-parse HEAD > build/signing-input/source-commit.txt
          printf '%s\n' "$BUILD_NUMBER" > build/signing-input/version-code.txt
          printf '%s\n' 'API_BASE=https://vip2100.com' 'USE_FAKE_API=false' 'EMPLOYEE_TOTALS_SOURCE=collections' 'COLLECTIONS_WHITE_GOLD=true' > build/signing-input/build-defines.txt
          sha256sum build/signing-input/DO-NOT-INSTALL-signing-input.apk > build/signing-input/sha256.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: production-signing-input-${{ inputs.build_number }}
          path: build/signing-input/
          if-no-files-found: error
          retention-days: 3
